<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Promotions & Pricing — SilverScreen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/sidebar.css" rel="stylesheet">
</head>
<body style="background:#0d1117;color:#e6edf3;margin:0;">
<div class="ss-page-title">🏷️ Promotions & Pricing</div>

<div class="row g-4">
    <div class="col-md-4">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;">Create Promotion</div>
            <form id="promoForm" onsubmit="savePromo(event)">
                <input type="hidden" id="pr_id">
                <div class="mb-3"><label class="ss-label">Promo Code</label><input type="text" id="pr_code" class="ss-form-control" required placeholder="e.g. MOVIE20" style="text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()"></div>
                <div class="mb-3"><label class="ss-label">Discount (%)</label><input type="number" step="0.1" min="1" max="100" id="pr_disc" class="ss-form-control" required></div>
                <div class="mb-3"><label class="ss-label">Description</label><input type="text" id="pr_desc" class="ss-form-control" required placeholder="e.g. Weekend special"></div>
                <div class="mb-3 d-flex align-items-center gap-2">
                    <input type="checkbox" id="pr_active" checked style="width:16px;height:16px;accent-color:#0ea5e9;">
                    <label for="pr_active" class="ss-label mb-0">Active</label>
                </div>
                <button type="submit" class="ss-btn ss-btn-primary w-100">Save Promotion</button>
            </form>
        </div>
    </div>

    <div class="col-md-8">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;">Active Promotions</div>
            <div style="overflow-x:auto;">
                <table class="table ss-table">
                    <thead><tr><th>Code</th><th>Discount</th><th>Description</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody id="promoTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
const user = requireAuth();
injectSidebar(user);

async function loadPromos() {
    const data = await fetch('/api/promotions').then(r=>r.json()).catch(()=>[]);
    document.getElementById('promoTable').innerHTML = data.map(p => `
        <tr>
            <td><span style="background:#7c3aed22;color:#a78bfa;border-radius:6px;padding:3px 12px;font-size:.8rem;font-weight:800;font-family:monospace;border:1px solid #7c3aed55;">${p.promoCode}</span></td>
            <td><span style="font-size:1.1rem;font-weight:800;color:#f59e0b;">${p.discountPercentage}%</span></td>
            <td style="color:#94a3b8;">${p.description}</td>
            <td>
                <button class="ss-btn ss-btn-sm" style="background:${p.active?'#14532d':'#1e293b'};color:${p.active?'#86efac':'#64748b'};border:1px solid ${p.active?'#166534':'#334155'};"
                    onclick="toggleActive(${p.id}, ${p.active}, ${JSON.stringify(p)})">
                    ${p.active ? '✅ Active' : '⏸ Inactive'}
                </button>
            </td>
            <td>
                <button class="ss-btn ss-btn-sm" style="background:#1e3a5f;color:#93c5fd;margin-right:4px;" onclick='editPromo(${JSON.stringify(p)})'>Edit</button>
                <button class="ss-btn ss-btn-danger ss-btn-sm" onclick="deletePromo(${p.id})">Delete</button>
            </td>
        </tr>`).join('') || '<tr><td colspan="5" class="text-center" style="color:#475569;padding:20px;">No promotions yet.</td></tr>';
}

async function toggleActive(id, current, p) {
    await fetch(`/api/promotions/${id}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ ...p, active: !current }),
    });
    loadPromos();
}

function editPromo(p) {
    document.getElementById('pr_id').value     = p.id;
    document.getElementById('pr_code').value   = p.promoCode;
    document.getElementById('pr_disc').value   = p.discountPercentage;
    document.getElementById('pr_desc').value   = p.description;
    document.getElementById('pr_active').checked = p.active;
}

async function savePromo(e) {
    e.preventDefault();
    const id   = document.getElementById('pr_id').value;
    const body = {
        promoCode:          document.getElementById('pr_code').value,
        discountPercentage: document.getElementById('pr_disc').value,
        description:        document.getElementById('pr_desc').value,
        active:             document.getElementById('pr_active').checked,
    };
    await fetch(id ? `/api/promotions/${id}` : '/api/promotions', {
        method: id ? 'PUT' : 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body),
    });
    document.getElementById('promoForm').reset();
    document.getElementById('pr_id').value = '';
    document.getElementById('pr_active').checked = true;
    loadPromos();
}
async function deletePromo(id) {
    if (confirm('Delete this promotion?')) { await fetch(`/api/promotions/${id}`,{method:'DELETE'}); loadPromos(); }
}

loadPromos();
</script>
</body>
</html>
