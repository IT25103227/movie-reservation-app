<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Cinema Halls — SilverScreen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/sidebar.css" rel="stylesheet">
</head>
<body style="background:#0d1117;color:#e6edf3;margin:0;">
<div class="ss-page-title">🏛️ Cinema Halls</div>

<div class="row g-4">
    <div class="col-md-4">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;">Add / Edit Hall</div>
            <form id="hallForm" onsubmit="saveHall(event)">
                <input type="hidden" id="h_id">
                <div class="mb-3"><label class="ss-label">Hall Name</label><input type="text" id="h_name" class="ss-form-control" required placeholder="e.g. Hall 1"></div>
                <div class="mb-3">
                    <label class="ss-label">Hall Type</label>
                    <select id="h_type" class="ss-form-control"><option>IMAX</option><option>Standard</option><option>3D Deluxe</option></select>
                </div>
                <div class="mb-3"><label class="ss-label">Total Capacity</label><input type="number" id="h_cap" class="ss-form-control" required min="1"></div>
                <div class="mb-3">
                    <label class="ss-label">Status</label>
                    <select id="h_stat" class="ss-form-control"><option>ACTIVE</option><option>MAINTENANCE</option></select>
                </div>
                <button type="submit" class="ss-btn ss-btn-primary w-100">Save Hall</button>
                <button type="button" class="ss-btn ss-btn-sm w-100 mt-2" style="background:#1e293b;color:#94a3b8;" onclick="resetHallForm()">Clear</button>
            </form>
        </div>
    </div>

    <div class="col-md-8">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;">Existing Cinema Halls</div>
            <div style="overflow-x:auto;">
                <table class="table ss-table">
                    <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Capacity</th><th>Status</th><th>Seat Preview</th><th>Action</th></tr></thead>
                    <tbody id="hallTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
const user = requireAuth();
injectSidebar(user);

function capacityTag(cap) {
    const color = cap >= 200 ? '#7c3aed' : cap >= 100 ? '#0ea5e9' : '#22c55e';
    return `<span style="background:${color}22;color:${color};border:1px solid ${color}55;border-radius:20px;padding:2px 10px;font-size:.72rem;font-weight:700;">${cap} seats</span>`;
}

function seatPreviewBtn(h) {
    const rows = Math.ceil((h.totalCapacity||0) / 8);
    return `<button class="ss-btn ss-btn-sm" style="background:#1e293b;color:#94a3b8;" title="${rows} rows × 8 cols"
        onclick="alert('Seat layout: ${rows} rows × 8 columns = ${h.totalCapacity} seats')">⬜ Preview</button>`;
}

async function loadHalls() {
    const data = await fetch('/api/halls').then(r=>r.json()).catch(()=>[]);
    document.getElementById('hallTable').innerHTML = data.map(h => `
        <tr>
            <td style="color:#475569;">#${h.id}</td>
            <td style="font-weight:600;">${h.hallName}</td>
            <td>${h.hallType}</td>
            <td>${capacityTag(h.totalCapacity)}</td>
            <td>${h.status === 'ACTIVE'
                ? '<span class="badge-active">ACTIVE</span>'
                : '<span class="badge-maint">MAINTENANCE</span>'}</td>
            <td>${seatPreviewBtn(h)}</td>
            <td>
                <button class="ss-btn ss-btn-sm" style="background:#1e3a5f;color:#93c5fd;margin-right:4px;" onclick='editHall(${JSON.stringify(h)})'>Edit</button>
                <button class="ss-btn ss-btn-danger ss-btn-sm" onclick="deleteHall(${h.id})">Delete</button>
            </td>
        </tr>`).join('') || '<tr><td colspan="7" class="text-center" style="color:#475569;padding:20px;">No halls configured.</td></tr>';
}

function editHall(h) {
    document.getElementById('h_id').value   = h.id;
    document.getElementById('h_name').value = h.hallName;
    document.getElementById('h_type').value = h.hallType;
    document.getElementById('h_cap').value  = h.totalCapacity;
    document.getElementById('h_stat').value = h.status;
}
function resetHallForm() {
    document.getElementById('hallForm').reset();
    document.getElementById('h_id').value = '';
}

async function saveHall(e) {
    e.preventDefault();
    const id   = document.getElementById('h_id').value;
    const body = {
        hallName:      document.getElementById('h_name').value,
        hallType:      document.getElementById('h_type').value,
        totalCapacity: document.getElementById('h_cap').value,
        status:        document.getElementById('h_stat').value,
    };
    await fetch(id ? `/api/halls/${id}` : '/api/halls', {
        method: id ? 'PUT' : 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body),
    });
    resetHallForm();
    loadHalls();
}
async function deleteHall(id) {
    if (confirm('Delete this hall?')) { await fetch(`/api/halls/${id}`,{method:'DELETE'}); loadHalls(); }
}

loadHalls();
</script>
</body>
</html>
