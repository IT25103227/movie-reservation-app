<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Dashboard & Reports — SilverScreen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/sidebar.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body style="background:#0d1117;color:#e6edf3;margin:0;">
<div class="ss-page-title">📊 Dashboard & Reports</div>

<!-- KPI Cards -->
<div class="kpi-grid" id="kpiGrid">
    <div class="kpi-card"><div class="kpi-label">Total Gross Revenue</div><div class="kpi-value" id="kpiRevenue">—</div><div class="kpi-sub">from confirmed bookings</div></div>
    <div class="kpi-card"><div class="kpi-label">Hall Occupancy Rate</div><div class="kpi-value" id="kpiOccupancy">—</div><div class="kpi-sub">seats sold vs capacity</div></div>
    <div class="kpi-card"><div class="kpi-label">Active Parking Bays</div><div class="kpi-value" id="kpiParking">—</div><div class="kpi-sub">available right now</div></div>
    <div class="kpi-card"><div class="kpi-label">Active Promotions</div><div class="kpi-value" id="kpiPromos">—</div><div class="kpi-sub">live discount codes</div></div>
</div>

<!-- Charts row -->
<div class="row g-4">
    <div class="col-lg-7">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;">📈 Monthly Ticket Revenue</div>
            <canvas id="revenueChart" height="220"></canvas>
        </div>
    </div>
    <div class="col-lg-5">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;">🍿 Tickets vs Concession Sales</div>
            <canvas id="donutChart" height="220"></canvas>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
const user = requireAuth();
injectSidebar(user);

async function loadDashboard() {
    const [bookings, parking, promos, halls] = await Promise.all([
        fetch('/api/bookings').then(r=>r.json()).catch(()=>[]),
        fetch('/api/parking-slots').then(r=>r.json()).catch(()=>[]),
        fetch('/api/promotions').then(r=>r.json()).catch(()=>[]),
        fetch('/api/halls').then(r=>r.json()).catch(()=>[]),
    ]);

    // ── KPIs ──
    const totalRevenue  = bookings.reduce((s,b) => s + (Number(b.totalAmount)||0), 0);
    const availParking  = parking.filter(p => p.status === 'AVAILABLE').length;
    const activePromos  = promos.filter(p => p.active).length;

    // Occupancy: count distinct sold seats vs total hall capacity
    const totalCapacity = halls.reduce((s,h) => s + (h.totalCapacity||0), 0);
    const soldSeats     = bookings.reduce((s,b) => {
        if (!b.seatNumbers) return s;
        return s + b.seatNumbers.split(',').filter(x=>x.trim()).length;
    }, 0);
    const occupancy = totalCapacity > 0 ? ((soldSeats / totalCapacity) * 100).toFixed(1) : '0.0';

    document.getElementById('kpiRevenue').textContent   = `$${totalRevenue.toFixed(2)}`;
    document.getElementById('kpiOccupancy').textContent = `${occupancy}%`;
    document.getElementById('kpiParking').textContent   = availParking;
    document.getElementById('kpiPromos').textContent    = activePromos;

    // ── Revenue bar chart: group by month ──
    const monthlyMap = {};
    bookings.forEach(b => {
        const month = `M${Math.floor(Math.random()*3)+1}`; // demo bucketing — replace with real date field when available
        monthlyMap[month] = (monthlyMap[month]||0) + (Number(b.totalAmount)||0);
    });
    // Fallback demo data if no bookings
    const months  = Object.keys(monthlyMap).length ? Object.keys(monthlyMap) : ['Jan','Feb','Mar','Apr','May','Jun'];
    const revenues= Object.keys(monthlyMap).length ? Object.values(monthlyMap) : [1200,1800,1400,2200,1900,2600];

    new Chart(document.getElementById('revenueChart'), {
        type: 'bar',
        data: {
            labels: months,
            datasets: [{ label: 'Revenue ($)', data: revenues,
                backgroundColor: '#0ea5e9', borderRadius: 6, borderSkipped: false }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } },
                y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } }
            }
        }
    });

    // ── Donut chart: ticket revenue vs concession revenue ──
    const ticketRev     = bookings.reduce((s,b) => s + (Number(b.totalAmount)||0) - (Number(b.discountAmount)||0), 0);
    const concessionRev = bookings.reduce((s,b) => {
        if (!b.orderedSnacks) return s;
        try { return s + JSON.parse(b.orderedSnacks).reduce((ss,i) => ss + (i.price||0)*(i.qty||0), 0); } catch { return s; }
    }, 0);

    new Chart(document.getElementById('donutChart'), {
        type: 'doughnut',
        data: {
            labels: ['Ticket Sales', 'Concession Sales'],
            datasets: [{ data: [ticketRev || 1800, concessionRev || 620],
                backgroundColor: ['#0ea5e9','#f59e0b'], borderWidth: 0, hoverOffset: 6 }]
        },
        options: {
            cutout: '68%',
            plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 16, font: { size: 12 } } } }
        }
    });
}

loadDashboard();
</script>
</body>
</html>
