<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilverScreen — Staff Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: #080c14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
        }
        .login-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 18px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 60px rgba(0,0,0,.5);
        }
        .login-logo {
            font-size: 2rem; font-weight: 800; color: #f59e0b;
            margin-bottom: 4px; letter-spacing: -.03em;
        }
        .login-sub { font-size: .83rem; color: #64748b; margin-bottom: 28px; }
        .field-label { display: block; font-size: .78rem; font-weight: 600; color: #94a3b8; margin-bottom: 5px; }
        .field-input {
            width: 100%; background: #1e293b; border: 1px solid #334155;
            color: #f1f5f9; border-radius: 8px; padding: 10px 14px;
            font-size: .9rem; margin-bottom: 16px; outline: none;
            transition: border-color .15s;
        }
        .field-input:focus { border-color: #38bdf8; }
        .field-input::placeholder { color: #475569; }
        .btn-login {
            width: 100%; background: #0ea5e9; border: none; border-radius: 10px;
            padding: 12px; color: #fff; font-size: .95rem; font-weight: 700;
            cursor: pointer; transition: background .15s;
        }
        .btn-login:hover { background: #0284c7; }
        .error-msg {
            background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5;
            border-radius: 8px; padding: 10px 14px; font-size: .83rem;
            margin-top: 14px; display: none;
        }
        .demo-hint {
            margin-top: 22px; border-top: 1px solid #1e293b; padding-top: 16px;
        }
        .demo-hint p { font-size: .73rem; color: #475569; margin-bottom: 6px; }
        .demo-table { font-size: .72rem; color: #64748b; width: 100%; }
        .demo-table td { padding: 2px 6px 2px 0; }
        .demo-table .cred { color: #94a3b8; font-family: monospace; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo">🎬 SilverScreen</div>
    <div class="login-sub">Staff & Admin Portal — Sign In</div>

    <label class="field-label" for="username">Username</label>
    <input class="field-input" type="text" id="username" placeholder="Enter username" autocomplete="username">

    <label class="field-label" for="password">Password</label>
    <input class="field-input" type="password" id="password" placeholder="Enter password" autocomplete="current-password"
           onkeydown="if(event.key==='Enter') doLogin()">

    <button class="btn-login" onclick="doLogin()">Sign In →</button>
    <div class="error-msg" id="errMsg">❌ Invalid username or password.</div>

    <!-- Quick reference for development -->
    <div class="demo-hint">
        <p>Demo credentials:</p>
        <table class="demo-table">
            <tr><td>Super Admin</td><td class="cred">admin / admin123</td></tr>
            <tr><td>Cinema Manager</td><td class="cred">manager / mgr123</td></tr>
            <tr><td>Marketing Mgr</td><td class="cred">marketing / mkt123</td></tr>
            <tr><td>Ticketing Staff</td><td class="cred">staff / staff123</td></tr>
            <tr><td>Parking Attendant</td><td class="cred">parking / park123</td></tr>
        </table>
    </div>
</div>

<script src="js/auth.js"></script>
<script>
    // If already logged in, redirect to landing page
    const existing = getCurrentUser();
    if (existing) {
        const LANDINGS = {
            SUPER_ADMIN:'dashboard.html', CINEMA_MANAGER:'dashboard.html',
            MARKETING_MANAGER:'promotions.html', TICKETING_STAFF:'bookings.html',
            PARKING_ATTENDANT:'parking.html'
        };
        window.location.href = LANDINGS[existing.role] || 'dashboard.html';
    }

    function doLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const ok = attemptLogin(u, p);
        if (!ok) document.getElementById('errMsg').style.display = 'block';
    }
</script>
</body>
</html>
