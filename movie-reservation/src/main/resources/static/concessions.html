<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Food & Concessions — SilverScreen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/sidebar.css" rel="stylesheet">
</head>
<body style="background:#0d1117;color:#e6edf3;margin:0;">
<div class="ss-page-title">🍿 Food & Concessions</div>

<div class="row g-4">
    <div class="col-md-4">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;">Add Menu Item</div>
            <form id="foodForm" onsubmit="saveFood(event)">
                <input type="hidden" id="f_id">
                <div class="mb-3"><label class="ss-label">Item Name</label><input type="text" id="f_name" class="ss-form-control" required></div>
                <div class="mb-3">
                    <label class="ss-label">Category</label>
                    <select id="f_cat" class="ss-form-control">
                        <option>Popcorn</option><option>Beverage</option><option>Snack</option><option>Combo</option>
                    </select>
                </div>
                <div class="mb-3"><label class="ss-label">Price ($)</label><input type="number" step="0.01" id="f_price" class="ss-form-control" required></div>
                <div class="mb-3 d-flex align-items-center gap-2">
                    <input type="checkbox" id="f_avail" checked style="width:16px;height:16px;accent-color:#0ea5e9;">
                    <label for="f_avail" class="ss-label mb-0">Available</label>
                </div>
                <button type="submit" class="ss-btn ss-btn-primary w-100">Save Item</button>
            </form>
        </div>
    </div>

    <div class="col-md-8">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;">Menu Items</div>
            <div id="concessionGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;"></div>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
const user = requireAuth();
injectSidebar(user);

const CAT_ICONS   = { Popcorn:'🍿', Beverage:'🥤', Snack:'🍫', Combo:'🎁' };
const CAT_COLORS  = { Popcorn:'#f59e0b', Beverage:'#0ea5e9', Snack:'#ec4899', Combo:'#22c55e' };

async function loadFood() {
    const data = await fetch('/api/food-items').then(r=>r.json()).catch(()=>[]);
    const grid  = document.getElementById('concessionGrid');
    grid.innerHTML = data.map(f => {
        const icon  = CAT_ICONS[f.category]  || '🛒';
        const color = CAT_COLORS[f.category] || '#94a3b8';
        return `
        <div style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;text-align:center;position:relative;">
            <div style="font-size:2rem;margin-bottom:6px;">${icon}</div>
            <div style="font-weight:700;font-size:.85rem;margin-bottom:4px;">${f.itemName}</div>
            <div style="margin-bottom:8px;">
                <span style="background:${color}22;color:${color};border-radius:20px;padding:2px 10px;font-size:.7rem;font-weight:700;border:1px solid ${color}55;">${f.category}</span>
            </div>
            <div style="font-size:1.1rem;font-weight:800;color:#f59e0b;margin-bottom:10px;">$${Number(f.price).toFixed(2)}</div>
            <div style="font-size:.72rem;margin-bottom:10px;">${f.isAvailable===false?'<span style="color:#fca5a5;">Unavailable</span>':'<span style="color:#86efac;">Available</span>'}</div>
            <button class="ss-btn ss-btn-danger ss-btn-sm w-100" onclick="deleteFood(${f.id})">Remove</button>
        </div>`;
    }).join('') || '<div style="color:#475569;">No menu items yet.</div>';
}

async function saveFood(e) {
    e.preventDefault();
    const body = {
        itemName:    document.getElementById('f_name').value,
        category:    document.getElementById('f_cat').value,
        price:       document.getElementById('f_price').value,
        isAvailable: document.getElementById('f_avail').checked,
    };
    await fetch('/api/food-items', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    document.getElementById('foodForm').reset();
    document.getElementById('f_avail').checked = true;
    loadFood();
}
async function deleteFood(id) {
    if (confirm('Remove this item from the menu?')) { await fetch(`/api/food-items/${id}`,{method:'DELETE'}); loadFood(); }
}

loadFood();
</script>
</body>
</html>
