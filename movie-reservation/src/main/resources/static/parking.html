<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Parking Management — SilverScreen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/sidebar.css" rel="stylesheet">
    <style>
        .bay-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:12px; margin-bottom:24px; }
        .bay-tile {
            background:#14532d; color:#86efac; border:2px solid #166534;
            border-radius:10px; padding:14px 8px; text-align:center; cursor:pointer;
            transition:transform .12s, box-shadow .12s; font-weight:700; font-size:.8rem;
        }
        .bay-tile.reserved  { background:#450a0a; color:#fca5a5; border-color:#7f1d1d; cursor:default; }
        .bay-tile.occupied  { background:#1c0a00; color:#fdba74; border-color:#92400e; cursor:default; }
        .bay-tile:hover:not(.reserved):not(.occupied) { transform:scale(1.06); box-shadow:0 0 14px #22c55e55; }
        .bay-icon { font-size:1.6rem; display:block; margin-bottom:4px; }
        .bay-type { font-size:.65rem; opacity:.7; margin-top:2px; }
    </style>
</head>
<body style="background:#0d1117;color:#e6edf3;margin:0;">
<div class="ss-page-title">🅿️ Parking Management</div>

<!-- Floor plan overview -->
<div class="ss-card mb-4">
    <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:6px;">Floor Plan Overview</div>
    <div style="font-size:.75rem;color:#475569;margin-bottom:16px;">Click an available bay to toggle it AVAILABLE ↔ MAINTENANCE</div>
    <div class="bay-grid" id="bayGrid"></div>
    <div style="display:flex;gap:16px;font-size:.75rem;color:#94a3b8;">
        <span><span style="display:inline-block;width:12px;height:12px;background:#14532d;border-radius:3px;margin-right:4px;"></span>Available</span>
        <span><span style="display:inline-block;width:12px;height:12px;background:#450a0a;border-radius:3px;margin-right:4px;"></span>Reserved</span>
        <span><span style="display:inline-block;width:12px;height:12px;background:#1c0a00;border-radius:3px;margin-right:4px;"></span>Occupied/Maintenance</span>
    </div>
</div>

<!-- Manage form + table -->
<div class="row g-4">
    <div class="col-md-4">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;">Manage Parking Slot</div>
            <form id="parkingForm" onsubmit="saveParking(event)">
                <input type="hidden" id="p_id">
                <div class="mb-3"><label class="ss-label">Slot Number</label><input type="text" id="p_slot" class="ss-form-control" required placeholder="e.g. P-01"></div>
                <div class="mb-3">
                    <label class="ss-label">Type</label>
                    <select id="p_type" class="ss-form-control"><option>Regular</option><option>VIP</option><option>Disabled</option></select>
                </div>
                <div class="mb-3"><label class="ss-label">Vehicle Number</label><input type="text" id="p_vehicle" class="ss-form-control" placeholder="Optional"></div>
                <div class="mb-3">
                    <label class="ss-label">Status</label>
                    <select id="p_status" class="ss-form-control"><option>AVAILABLE</option><option>RESERVED</option><option>OCCUPIED</option></select>
                </div>
                <button type="submit" class="ss-btn ss-btn-primary w-100">Save Slot</button>
                <button type="button" class="ss-btn ss-btn-sm w-100 mt-2" style="background:#1e293b;color:#94a3b8;" onclick="resetForm()">Clear</button>
            </form>
        </div>
    </div>

    <div class="col-md-8">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;">All Parking Slots</div>
            <div style="overflow-x:auto;">
                <table class="table ss-table">
                    <thead><tr><th>ID</th><th>Slot #</th><th>Type</th><th>Vehicle</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody id="parkingTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
const user = requireAuth();
injectSidebar(user);

let allSlots = [];

async function loadParking() {
    allSlots = await fetch('/api/parking-slots').then(r=>r.json()).catch(()=>[]);
    renderFloorPlan(allSlots);
    renderTable(allSlots);
}

function renderFloorPlan(slots) {
    document.getElementById('bayGrid').innerHTML = slots.map(s => {
        const st  = s.status?.toUpperCase() || 'AVAILABLE';
        const cls = st === 'RESERVED' ? 'reserved' : st === 'AVAILABLE' ? '' : 'occupied';
        const ico = st === 'RESERVED' ? '🚫' : st === 'AVAILABLE' ? '🚗' : '🔧';
        const clickable = st === 'AVAILABLE' || st === 'OCCUPIED';
        return `<div class="bay-tile ${cls}" ${clickable ? `onclick="quickToggle(${s.id},'${st}')"` : ''}>
            <span class="bay-icon">${ico}</span>
            ${s.slotNumber}
            <div class="bay-type">${s.slotType}</div>
        </div>`;
    }).join('') || '<div style="color:#475569;">No parking slots configured.</div>';
}

async function quickToggle(id, currentStatus) {
    const newStatus = currentStatus === 'AVAILABLE' ? 'OCCUPIED' : 'AVAILABLE';
    await fetch(`/api/parking-slots/${id}`, {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ status: newStatus }),
    });
    loadParking();
}

function renderTable(slots) {
    document.getElementById('parkingTable').innerHTML = slots.map(s => `
        <tr>
            <td style="color:#475569;">#${s.id}</td>
            <td style="font-weight:600;">${s.slotNumber}</td>
            <td>${s.slotType}</td>
            <td style="font-size:.8rem;color:#94a3b8;">${s.vehicleNumber||'—'}</td>
            <td>${s.status==='AVAILABLE'?'<span class="badge-avail">AVAILABLE</span>':
                 s.status==='RESERVED' ?'<span class="badge-res">RESERVED</span>' :
                 '<span class="badge-maint">OCCUPIED</span>'}</td>
            <td>
                <button class="ss-btn ss-btn-sm" style="background:#1e3a5f;color:#93c5fd;margin-right:4px;" onclick='editSlot(${JSON.stringify(s)})'>Edit</button>
                <button class="ss-btn ss-btn-danger ss-btn-sm" onclick="deleteSlot(${s.id})">Delete</button>
            </td>
        </tr>`).join('') || '<tr><td colspan="6" class="text-center" style="color:#475569;padding:20px;">No slots.</td></tr>';
}

function editSlot(s) {
    document.getElementById('p_id').value      = s.id;
    document.getElementById('p_slot').value    = s.slotNumber;
    document.getElementById('p_type').value    = s.slotType;
    document.getElementById('p_vehicle').value = s.vehicleNumber||'';
    document.getElementById('p_status').value  = s.status;
}
function resetForm() { document.getElementById('parkingForm').reset(); document.getElementById('p_id').value=''; }

async function saveParking(e) {
    e.preventDefault();
    const id   = document.getElementById('p_id').value;
    const body = {
        slotNumber:    document.getElementById('p_slot').value,
        slotType:      document.getElementById('p_type').value,
        vehicleNumber: document.getElementById('p_vehicle').value,
        status:        document.getElementById('p_status').value,
    };
    await fetch(id ? `/api/parking-slots/${id}` : '/api/parking-slots', {
        method: id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body),
    });
    resetForm(); loadParking();
}
async function deleteSlot(id) {
    if (confirm('Delete this slot?')) { await fetch(`/api/parking-slots/${id}`,{method:'DELETE'}); loadParking(); }
}

loadParking();
</script>
</body>
</html>
