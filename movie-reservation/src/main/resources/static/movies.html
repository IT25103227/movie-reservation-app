<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Movies & Showtimes — SilverScreen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/sidebar.css" rel="stylesheet">
    <style>
        /* ── Poster thumbnail in form ── */
        #posterPreviewBox {
            width: 100px; height: 140px;
            border: 2px dashed #334155; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: #1e293b; color: #475569; font-size: 2.2rem;
            overflow: hidden; margin-top: 8px; flex-shrink: 0;
            transition: border-color .2s;
        }
        #posterPreviewBox img { width:100%; height:100%; object-fit:cover; border-radius:8px; }

        /* ── Poster thumbnail in table ── */
        .movie-poster-thumb {
            width: 48px; height: 68px; object-fit: cover;
            border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.4);
        }
        .movie-poster-fallback {
            width: 48px; height: 68px; border-radius: 6px;
            background: #1e293b; border: 1px solid #334155;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
        }
    </style>
</head>
<body style="background:#0d1117;color:#e6edf3;margin:0;">

<div class="ss-page-title">🎬 Movies & Showtimes</div>

<div class="row g-4">

    <!-- ═══ FORM COLUMN (hidden for MARKETING_MANAGER) ═══ -->
    <div class="col-xl-4 col-lg-5" id="movieFormCol">
        <div class="ss-card">
            <div style="font-size:.85rem;font-weight:700;color:#94a3b8;margin-bottom:16px;" id="formCardTitle">➕ Add Movie</div>
            <form id="movieForm" onsubmit="saveMovie(event)">
                <input type="hidden" id="m_id">

                <div class="mb-3"><label class="ss-label">Title *</label>
                    <input type="text" id="m_title" class="ss-form-control" required placeholder="e.g. Inception"></div>

                <div class="mb-3"><label class="ss-label">Genre *</label>
                    <input type="text" id="m_genre" class="ss-form-control" required placeholder="e.g. Sci-Fi"></div>

                <div class="mb-3"><label class="ss-label">Duration (mins) *</label>
                    <input type="number" id="m_dur" class="ss-form-control" required min="1" placeholder="e.g. 148"></div>

                <div class="mb-3"><label class="ss-label">Showtime *</label>
                    <input type="text" id="m_show" class="ss-form-control" required placeholder="e.g. 18:30"></div>

                <div class="mb-3"><label class="ss-label">Ticket Price ($) *</label>
                    <input type="number" step="0.01" id="m_price" class="ss-form-control" required min="0" placeholder="e.g. 12.50"></div>

                <!-- Poster image URL with live preview -->
                <div class="mb-3">
                    <label class="ss-label">Poster Image URL</label>
                    <input type="url" id="m_poster" class="ss-form-control" placeholder="https://…/poster.jpg"
                           oninput="updatePosterPreview(this.value)">
                    <div id="posterPreviewBox">🎬</div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="ss-btn ss-btn-primary flex-grow-1">Save Movie</button>
                    <button type="button" class="ss-btn" style="background:#1e293b;color:#94a3b8;border:1px solid #334155;" onclick="resetForm()">Clear</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ═══ CATALOG COLUMN ═══ -->
    <div class="col-xl-8 col-lg-7">
        <div class="ss-card">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-3">
                <div style="font-size:.85rem;font-weight:700;color:#94a3b8;">Movie Catalog</div>
                <span id="movieCount" style="font-size:.75rem;color:#475569;"></span>
            </div>

            <!-- Search bar -->
            <input type="text" class="ss-search" id="movieSearch"
                   placeholder="🔍  Search by title or genre…"
                   oninput="filterMovies()" style="max-width:100%;">

            <div style="overflow-x:auto;">
                <table class="table ss-table" id="movieCatalogTable">
                    <thead>
                        <tr>
                            <th style="width:58px;">Poster</th>
                            <th>Title</th>
                            <th>Genre</th>
                            <th>Duration</th>
                            <th>Showtime</th>
                            <th>Price</th>
                            <th id="actionHeader">Action</th>
                        </tr>
                    </thead>
                    <tbody id="movieTable"></tbody>
                </table>
            </div>
        </div>
    </div>

</div><!-- /.row -->

<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
/* ── Auth & sidebar ── */
const user = requireAuth();
injectSidebar(user);

/* ── Role guard: Marketing Manager = read-only ── */
const isReadOnly = user.role === 'MARKETING_MANAGER';
if (isReadOnly) {
    document.getElementById('movieFormCol').style.display = 'none';
    document.getElementById('actionHeader').style.display = 'none';
}

/* ── Genre → emoji map (keys must be quoted strings) ── */
const GENRE_ICONS = {
    'Action':    '🧨',
    'Comedy':    '😂',
    'Drama':     '🎭',
    'Horror':    '👻',
    'Sci-Fi':    '🚀',
    'Sci-fi':    '🚀',
    'Romance':   '💕',
    'Thriller':  '🔪',
    'Animation': '🎨',
    'Adventure': '🌋',
    'Crime':     '🕵️',
    'Fantasy':   '🧙',
};
function genreIcon(g) { return GENRE_ICONS[g] || '🎬'; }

/* ── Live poster preview ── */
function updatePosterPreview(url) {
    const box = document.getElementById('posterPreviewBox');
    if (url && url.trim()) {
        box.innerHTML = `<img src="${url.trim()}" alt="poster"
            onerror="this.parentElement.innerHTML='🎬'">`;
        box.style.borderColor = '#38bdf8';
    } else {
        box.innerHTML = '🎬';
        box.style.borderColor = '#334155';
    }
}

/* ── State ── */
let allMovies = [];

/* ── Load & render ── */
async function loadMovies() {
    allMovies = await fetch('/api/movies').then(r => r.json()).catch(() => []);
    document.getElementById('movieCount').textContent =
        `${allMovies.length} movie${allMovies.length !== 1 ? 's' : ''}`;
    filterMovies();
}

function filterMovies() {
    const q = document.getElementById('movieSearch').value.toLowerCase();
    const filtered = allMovies.filter(m =>
        (m.title || '').toLowerCase().includes(q) ||
        (m.genre || '').toLowerCase().includes(q)
    );
    renderTable(filtered);
}

function renderTable(movies) {
    if (!movies.length) {
        document.getElementById('movieTable').innerHTML =
            '<tr><td colspan="7" class="text-center" style="color:#475569;padding:24px;">No movies found.</td></tr>';
        return;
    }
    document.getElementById('movieTable').innerHTML = movies.map(m => {
        /* Poster cell */
        const posterCell = m.posterUrl
            ? `<img class="movie-poster-thumb" src="${m.posterUrl}" alt="${m.title}"
                   onerror="this.outerHTML='<div class=movie-poster-fallback>${genreIcon(m.genre)}</div>'">`
            : `<div class="movie-poster-fallback">${genreIcon(m.genre)}</div>`;

        /* Badge chips */
        const genreBadge    = `<span class="badge bg-primary">${m.genre}</span>`;
        const durationBadge = `<span class="badge bg-secondary">${m.durationMinutes} mins</span>`;
        const showtimeBadge = `<span class="badge bg-dark border border-info text-info">🕐 ${m.showtime}</span>`;
        const pricePill     = `<span class="fw-bold text-warning">$${Number(m.ticketPrice).toFixed(2)}</span>`;

        /* Action buttons */
        const actions = isReadOnly ? '' : `
            <button class="ss-btn ss-btn-sm" style="background:#1e3a5f;color:#93c5fd;margin-right:4px;"
                onclick='editMovie(${JSON.stringify(m)})'>Edit</button>
            <button class="ss-btn ss-btn-danger ss-btn-sm"
                onclick="deleteMovie(${m.id})">Delete</button>`;

        return `<tr>
            <td>${posterCell}</td>
            <td style="font-weight:600;max-width:180px;">${m.title}</td>
            <td>${genreBadge}</td>
            <td>${durationBadge}</td>
            <td>${showtimeBadge}</td>
            <td>${pricePill}</td>
            <td ${isReadOnly ? 'style="display:none"' : ''}>${actions}</td>
        </tr>`;
    }).join('');
}

/* ── Edit: populate form ── */
function editMovie(m) {
    document.getElementById('m_id').value     = m.id;
    document.getElementById('m_title').value  = m.title;
    document.getElementById('m_genre').value  = m.genre;
    document.getElementById('m_dur').value    = m.durationMinutes;
    document.getElementById('m_show').value   = m.showtime;
    document.getElementById('m_price').value  = m.ticketPrice;
    document.getElementById('m_poster').value = m.posterUrl || '';
    updatePosterPreview(m.posterUrl || '');
    document.getElementById('formCardTitle').textContent = '✏️ Edit Movie';
    document.querySelector('.ss-main').scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
    document.getElementById('movieForm').reset();
    document.getElementById('m_id').value = '';
    document.getElementById('formCardTitle').textContent = '➕ Add Movie';
    updatePosterPreview('');
}

/* ── Save (POST new / PUT update) ── */
async function saveMovie(e) {
    e.preventDefault();
    const id   = document.getElementById('m_id').value;
    const body = {
        title:           document.getElementById('m_title').value,
        genre:           document.getElementById('m_genre').value,
        durationMinutes: parseInt(document.getElementById('m_dur').value),
        showtime:        document.getElementById('m_show').value,
        ticketPrice:     parseFloat(document.getElementById('m_price').value),
        posterUrl:       document.getElementById('m_poster').value.trim() || null,
    };
    await fetch(id ? `/api/movies/${id}` : '/api/movies', {
        method:  id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body),
    });
    resetForm();
    loadMovies();
}

/* ── Delete ── */
async function deleteMovie(id) {
    if (confirm('Delete this movie? This cannot be undone.')) {
        await fetch(`/api/movies/${id}`, { method: 'DELETE' });
        loadMovies();
    }
}

loadMovies();
</script>
</body>
</html>
